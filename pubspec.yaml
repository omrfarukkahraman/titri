name: titri
description: "Titreşim tabanlı erişilebilir mesajlaşma uygulaması - Teknofest 2026"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.6
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Routing
  go_router: ^14.6.3
  
  # Vibration
  vibration: ^2.0.1
  
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  
  # Utils
  shared_preferences: ^2.3.4
  intl: ^0.20.1
  uuid: ^4.5.1
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
